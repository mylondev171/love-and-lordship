<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library — Watch, Read, Listen — Love &amp; Lordship</title>
  <meta name="description" content="The complete Love & Lordship media library — sermons, articles, podcasts, and radio. Filter by topic, format, or series." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../components/nav.css" />
  <link rel="stylesheet" href="../components/hero.css" />
  <link rel="stylesheet" href="../components/pillars.css" />
  <link rel="stylesheet" href="../components/book-media.css" />
  <link rel="stylesheet" href="../components/sections.css" />
  <link rel="stylesheet" href="../components/pages.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../components/nav.jsx"></script>
  <script type="text/babel" src="../components/footer-events-app.jsx"></script>
  <script type="text/babel" src="../components/page-shell.jsx"></script>

  <script type="text/babel">
    const LIBRARY = [
      { fmt: "Watch", topic: "Lordship", series: "Authority of Love", title: "What the Authority of Love really means", dur: "32 min", img: "video · keynote stage", imgPath: "../assets/images/keynote-stage.png" },
      { fmt: "Watch", topic: "Marriage", series: "Marriage Unleashed", title: "Marriage isn't a contract — it's a covenant", dur: "12 min", img: "video · marriage talk", imgPath: "../assets/images/marriage-talk.png" },
      { fmt: "Watch", topic: "Family", series: "Character Matters", title: "Character starts in the home", dur: "8 min", img: "video · classroom", imgPath: "../assets/images/classroom.png" },
      { fmt: "Watch", topic: "Discipleship", series: "Conference", title: "Greg in Cameroon — the African church rising", dur: "23 min", img: "video · conference", imgPath: "../assets/images/conference-africa.png" },
      { fmt: "Watch", topic: "Family", series: "Devotional", title: "A father's blessing changes a son", dur: "6 min", img: "video · father & son", imgPath: "../assets/images/father-blessing.png" },
      { fmt: "Watch", topic: "Lordship", series: "Sermon", title: "Surrender is a daily decision", dur: "28 min", img: "video · pulpit", imgPath: "../assets/images/pulpit.png" },
      { fmt: "Read", topic: "Relationship", series: "Essay", title: "The week we re-learned forgiveness", dur: "12 min read", img: "photo · open journal", imgPath: "../assets/images/open-journal.png" },
      { fmt: "Read", topic: "Discipleship", series: "Article", title: "Why we don't teach 'find your purpose'", dur: "5 min read", img: "photo · notebook", imgPath: "../assets/images/notebook.png" },
      { fmt: "Read", topic: "Marriage", series: "Article", title: "The first conversation every couple needs", dur: "8 min read", img: "photo · two coffee cups", imgPath: "../assets/images/two-coffee-cups.png" },
      { fmt: "Read", topic: "Lordship", series: "Reading plan", title: "Authority of Love — 30-day reading plan", dur: "30 days", img: "photo · bible & pen", imgPath: "../assets/images/bible-and-pen.png" },
      { fmt: "Read", topic: "Family", series: "Article", title: "Grandparenting on purpose", dur: "3 min read", img: "photo · grandparent & child", imgPath: "../assets/images/grandparent-and-child.png" },
      { fmt: "Read", topic: "Relationship", series: "Devotional", title: "Loved · A 30-day journey", dur: "30 days", img: "photo · sunrise", imgPath: "../assets/images/sunrise.png" },
      { fmt: "Listen", topic: "Lordship", series: "Radio", title: "The Authority of Love — weekdays, 11 AM ET", dur: "WJMM 99.1 FM", img: "audio · microphone", imgPath: "../assets/images/microphone-studio.png" },
      { fmt: "Listen", topic: "Discipleship", series: "Podcast Ep. 142", title: "Discipleship in a distracted age", dur: "38 min", img: "audio · podcast cover", imgPath: "../assets/images/podcast-cover.png" },
      { fmt: "Listen", topic: "Relationship", series: "KY's Voice", title: "Listening before answering", dur: "Monthly · 26 min", img: "audio · radio dial", imgPath: "../assets/images/radio-dial.png" },
      { fmt: "Listen", topic: "Marriage", series: "Podcast Ep. 141", title: "When marriages survive the hard years", dur: "41 min", img: "audio · couple interview", imgPath: "../assets/images/marriage-resilient.png" },
      { fmt: "Listen", topic: "Family", series: "Podcast Ep. 140", title: "Conversations every teenager needs", dur: "44 min", img: "audio · podcast cover", imgPath: "../assets/images/podcast-cover.png" },
      { fmt: "Listen", topic: "Lordship", series: "Sermon audio", title: "The cost of going second", dur: "29 min", img: "audio · waveform", imgPath: "../assets/images/waveform.png" },
    ];
    const FORMATS = ["All", "Watch", "Read", "Listen"];
    const TOPICS = ["All topics", "Lordship", "Discipleship", "Relationship", "Marriage", "Family"];

    function Play() { return <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M4 3l6 3.5L4 10z" fill="currentColor"/></svg>; }

    function LibraryPage() {
      const [fmt, setFmt] = React.useState("All");
      const [topic, setTopic] = React.useState("All topics");

      const visible = LIBRARY.filter(item =>
        (fmt === "All" || item.fmt === fmt) &&
        (topic === "All topics" || item.topic === topic)
      );

      return (
        <PageShell header={
          <PageHeader
            eyebrow="Watch · Read · Listen"
            title="The full <em>library</em>."
            sub="Every sermon, article, podcast, and radio episode from twenty years of teaching. Filter by format or by mission pillar."
            deco="M"
          />
        }>
          <section className="page-section">
            <div className="wrap">
              <div style={{ display: "flex", flexWrap: "wrap", gap: 24, alignItems: "center", justifyContent: "space-between", marginBottom: 24 }}>
                <div className="chip-row" style={{ marginBottom: 0 }}>
                  {FORMATS.map(f => (
                    <button className={"chip" + (fmt === f ? " on" : "")} key={f} onClick={() => setFmt(f)}>{f}</button>
                  ))}
                </div>
                <div className="chip-row" style={{ marginBottom: 0 }}>
                  {TOPICS.map(t => (
                    <button className={"chip" + (topic === t ? " on" : "")} key={t} onClick={() => setTopic(t)}>{t}</button>
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 18 }}>
                <div className="eyebrow">{visible.length} resource{visible.length === 1 ? "" : "s"}</div>
                <div className="muted" style={{ fontSize: 13 }}>Sorted by most recent</div>
              </div>

              <div className="lib-grid">
                {visible.map((m, i) => (
                  <a className="lib-card" key={i} href="#">
                    <div className="th">
                      <div className="imgph dark">
                        {m.imgPath && <img src={m.imgPath} alt="" />}
                        <span className="lbl">{m.img}</span>
                      </div>
                      <span className="play" aria-hidden="true"><Play /></span>
                    </div>
                    <div className="meta">
                      <span className="badge">{m.fmt} · {m.topic}</span>
                      <h4>{m.title}</h4>
                      <span className="dur">{m.dur} · {m.series}</span>
                    </div>
                  </a>
                ))}
              </div>

              {visible.length === 0 && (
                <div style={{ padding: "80px 0", textAlign: "center", color: "var(--ink-mute)" }}>
                  Nothing here yet — try a different filter.
                </div>
              )}
            </div>
          </section>

          <section className="page-section" style={{ background: "var(--paper)" }}>
            <div className="wrap">
              <div className="split-cols">
                <div>
                  <div className="eyebrow">Subscribe</div>
                  <h2>Take it with you — <em>wherever</em> you listen.</h2>
                </div>
                <div>
                  <p>The Authority of Love podcast is published weekly. New sermons drop every Sunday evening. The radio program airs weekdays at 11:00 AM ET on WJMM 99.1 FM and is rebroadcast monthly on Word Media's WGTK 970 AM.</p>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 22 }}>
                    <a className="btn btn-ghost" href="#">Apple Podcasts</a>
                    <a className="btn btn-ghost" href="#">Spotify</a>
                    <a className="btn btn-ghost" href="#">YouTube</a>
                    <a className="btn btn-ghost" href="#">RSS</a>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <CTAStrip
            eyebrow="Newsletter"
            title="A weekly devotional, <em>delivered</em>."
            body="Greg's weekly letter — devotional, reflection, and event invites. New subscribers get the 30-day Authority of Love reading plan."
            primary={<a className="btn btn-give" href="../Love%20and%20Lordship.html#newsletter">Subscribe to the letter</a>}
          />
        </PageShell>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<LibraryPage />);
  </script>
</body>
</html>
