<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Every Love &amp; Lordship article — devotionals, teaching series and commentary from Greg Williams, organized by the seven priorities." />
  <link rel="canonical" href="https://loveandlordship.com/pages/blog.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Articles &mdash; Love &amp; Lordship" />
  <meta property="og:description" content="Every Love &amp; Lordship article — devotionals, teaching series and commentary from Greg Williams, organized by the seven priorities." />
  <meta property="og:url" content="https://loveandlordship.com/pages/blog.html" />
  <meta property="og:image" content="https://loveandlordship.com/assets/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Love &amp; Lordship" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#234090" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../components/nav.css" />
  <link rel="stylesheet" href="../components/hero.css" />
  <link rel="stylesheet" href="../components/pillars.css" />
  <link rel="stylesheet" href="../components/book-media.css" />
  <link rel="stylesheet" href="../components/sections.css" />
  <link rel="stylesheet" href="../components/pages.css" />
  <link rel="stylesheet" href="../components/article.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Generated by tools/build_articles.py. Never hand-edit. -->
  <script src="../data/articles.js"></script>

  <script type="text/babel" src="../components/nav.jsx"></script>
  <script type="text/babel" src="../components/footer-events-app.jsx"></script>
  <script type="text/babel" src="../components/page-shell.jsx"></script>

  <script type="text/babel">
    const ALL = window.LL_ARTICLES || [];
    const PILLARS = [
      { key: "all",          label: "All priorities" },
      { key: "lordship",     label: "Love & Lordship" },
      { key: "discipleship", label: "Discipleship" },
      { key: "relationship", label: "Relationship" },
      { key: "marriage",     label: "Marriage" },
      { key: "family",       label: "Family" },
      { key: "church",       label: "Church" },
      { key: "culture",      label: "Culture" },
    ];
    const LABEL = Object.fromEntries(PILLARS.map(p => [p.key, p.label]));
    const PAGE = 30;

    const longDate = (iso) =>
      new Date(iso + "T00:00:00").toLocaleDateString("en-US",
        { year: "numeric", month: "long", day: "numeric" });

    function Blog() {
      const [q, setQ] = React.useState("");
      const [pillar, setPillar] = React.useState("all");
      const [shown, setShown] = React.useState(PAGE);

      // Deep link from the library's priority chips: /pages/blog.html#marriage
      React.useEffect(() => {
        const h = window.location.hash.replace("#", "");
        if (h && LABEL[h]) setPillar(h);
      }, []);

      const list = React.useMemo(() => {
        const needle = q.trim().toLowerCase();
        return ALL.filter(a => {
          if (pillar !== "all" && !(a.p || []).includes(pillar)) return false;
          if (!needle) return true;
          return (a.t + " " + a.x).toLowerCase().includes(needle);
        });
      }, [q, pillar]);

      React.useEffect(() => { setShown(PAGE); }, [q, pillar]);

      return (
        <PageShell header={
          <PageHeader
            deco="Read"
            eyebrow="Articles &middot; 30+ years of writing"
            title="Every article, <em>in one place</em>."
            sub={`${ALL.length} devotionals, teaching series and commentary from Greg Williams — searchable and filtered by the seven priorities.`}
          />
        }>
          <section className="lib-section">
            <div className="wrap">
              <div className="lib-controls">
                <label className="lib-search">
                  <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/>
                    <path d="m11 11 3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                  </svg>
                  <input
                    type="search"
                    value={q}
                    onChange={e => setQ(e.target.value)}
                    placeholder="Search titles and summaries — try &ldquo;forgiveness&rdquo;"
                    aria-label="Search articles"
                  />
                </label>
                <div className="lib-chips">
                  {PILLARS.map(p => (
                    <button
                      key={p.key}
                      className={"chip" + (pillar === p.key ? " on" : "")}
                      onClick={() => setPillar(p.key)}
                    >{p.label}</button>
                  ))}
                </div>
              </div>

              <p className="lib-count">
                {list.length === ALL.length
                  ? `${ALL.length} articles`
                  : `${list.length} of ${ALL.length} articles`}
              </p>

              <ol className="art-list">
                {list.slice(0, shown).map(a => (
                  <li key={a.slug}>
                    <a href={`../blog/${a.slug}.html`}>
                      <div className="art-when">
                        <time dateTime={a.d}>{longDate(a.d)}</time>
                        <span>{a.m} min read</span>
                      </div>
                      <h3>{a.t}</h3>
                      <p>{a.x}</p>
                      <div className="art-tags">
                        {(a.p || []).map(k => <span key={k}>{LABEL[k] || k}</span>)}
                      </div>
                    </a>
                  </li>
                ))}
              </ol>

              {list.length === 0 && (
                <p className="lib-empty">
                  Nothing matched. Try a different word, or <button className="btn-link" onClick={() => { setQ(""); setPillar("all"); }}>clear the filters</button>.
                </p>
              )}

              {shown < list.length && (
                <div className="lib-more">
                  <button className="btn btn-primary" onClick={() => setShown(s => s + PAGE)}>
                    Load {Math.min(PAGE, list.length - shown)} more
                  </button>
                </div>
              )}
            </div>
          </section>
        </PageShell>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Blog />);
  </script>
</body>
</html>
