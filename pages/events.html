<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events — Love &amp; Lordship</title>
  <meta name="description" content="Marriage conferences, discipleship intensives, and partner events from Love & Lordship — find one near you or invite us to your city." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../components/nav.css" />
  <link rel="stylesheet" href="../components/hero.css" />
  <link rel="stylesheet" href="../components/pillars.css" />
  <link rel="stylesheet" href="../components/book-media.css" />
  <link rel="stylesheet" href="../components/sections.css" />
  <link rel="stylesheet" href="../components/pages.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../components/nav.jsx"></script>
  <script type="text/babel" src="../components/footer-events-app.jsx"></script>
  <script type="text/babel" src="../components/page-shell.jsx"></script>

  <script type="text/babel">
    // The 2026 schedule lives in components/footer-events-app.jsx (window.LL_EVENTS)
    // so the homepage preview and this page never drift apart.
    const ALL_EVENTS = window.LL_EVENTS || [];
    const TODAY = new Date().toISOString().slice(0, 10);
    const FILTERS = ["All", "Men's event", "Retreat", "Church service", "Partner event", "Broadcast"];

    function Pin() { return <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M6.5 11.5s4-3.2 4-6.5a4 4 0 1 0-8 0c0 3.3 4 6.5 4 6.5z"/><circle cx="6.5" cy="5" r="1.4"/></svg>; }
    function CalIcon() { return <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" strokeWidth="1.3"><rect x="1.5" y="2.5" width="10" height="9" rx="1"/><path d="M1.5 5h10M4 1.5v2M9 1.5v2"/></svg>; }
    function Ticket() { return <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M2 4h9v5H2zM2 6.5h9"/></svg>; }

    function EventsPage() {
      const [filter, setFilter] = React.useState("All");
      const [showPast, setShowPast] = React.useState(false);
      const upcoming = ALL_EVENTS.filter(e => e.on >= TODAY);
      const past = ALL_EVENTS.filter(e => e.on < TODAY).reverse();
      const pool = showPast ? past : upcoming;
      const visible = pool.filter(e => filter === "All" || e.type === filter);

      return (
        <PageShell header={
          <PageHeader
            eyebrow="Conferences · Trainings · Retreats"
            title="Where we'll be <em>this year</em>."
            sub="From a Saturday-morning marriage conference in your city to an international keynote — find an event, register, or invite us to come to you."
            deco="E"
          />
        }>
          <section className="page-section">
            <div className="wrap">
              <div style={{ display: "flex", flexWrap: "wrap", gap: 24, alignItems: "center", justifyContent: "space-between", marginBottom: 32 }}>
                <div className="chip-row" style={{ marginBottom: 0 }}>
                  {FILTERS.map(f => (
                    <button className={"chip" + (filter === f ? " on" : "")} key={f} onClick={() => setFilter(f)}>{f}</button>
                  ))}
                </div>
                <div className="chip-row" style={{ marginBottom: 0 }}>
                  <button className={"chip" + (!showPast ? " on" : "")} onClick={() => setShowPast(false)}>Upcoming ({upcoming.length})</button>
                  <button className={"chip" + (showPast ? " on" : "")} onClick={() => setShowPast(true)}>Earlier in 2026 ({past.length})</button>
                </div>
              </div>

              <div className="events-list">
                {visible.map((e, i) => (
                  <a className="event-row" key={i} href={"contact.html?subject=" + encodeURIComponent("Question about " + e.name.replace(/&amp;/g, "&") + " (" + e.date + ")")}>
                    <div className="date">{e.date}<span className="yr">{e.year}</span></div>
                    <div className="info">
                      <h3 dangerouslySetInnerHTML={{ __html: e.name }} />
                      <div className="meta">
                        <span><Pin /> {e.loc}</span>
                        <span><CalIcon /> {e.type}</span>
                        <span><Ticket /> Details on request</span>
                      </div>
                    </div>
                    <span className={"badge" + (e.featured ? " featured" : "")}>{e.badge}</span>
                    <span className="go" aria-hidden="true">
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    </span>
                  </a>
                ))}
              </div>

              {visible.length === 0 && (
                <div style={{ padding: "60px 0", textAlign: "center", color: "var(--ink-mute)" }}>
                  {showPast ? "Nothing in that category earlier this year." : "No upcoming dates in that category yet."} <a className="btn-link" href="contact.html">Ask about upcoming dates <span className="arr">→</span></a>
                </div>
              )}
            </div>
          </section>

          <section className="page-section" style={{ background: "var(--paper)" }}>
            <div className="wrap">
              <div className="split-cols">
                <div>
                  <div className="eyebrow">What to expect</div>
                  <h2>Every event has the same <em>foundation</em>.</h2>
                </div>
                <div>
                  <p>Worship and a clear word from Scripture; practical, time-tested teaching on marriage, family, and discipleship; and time to interact with your spouse or small group between sessions. Flexible and adaptive schedules include:</p>
                  <ul style={{ paddingLeft: 18, color: "var(--ink-soft)", fontSize: 16, lineHeight: 1.7 }}>
                    <li>Saturday marriage or men's conferences run 9 AM – 4 PM with two breaks.</li>
                    <li>Retreats are Friday evening through Saturday evening or Sunday morning.</li>
                    <li>Webinars and replays are available afterward to all registered attendees (capacity permitting — please ask).</li>
                    <li>Scholarships available — contact us before registering.</li>
                  </ul>
                </div>
              </div>
            </div>
          </section>

          <CTAStrip
            eyebrow="Host us"
            title="Bring an event to your <em>city</em>."
            body="We work with churches, partner ministries, and individuals to bring conferences, intensives, and trainings to communities across the country and around the world."
            primary={<a className="btn btn-give" href="invite-greg.html">Invite Greg to speak</a>}
            secondary={<a className="btn btn-ghost" href="contact.html" style={{ borderColor: "oklch(0.4 0.02 60)", color: "oklch(0.92 0.02 70)" }}>Ask a question</a>}
          />
        </PageShell>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<EventsPage />);
  </script>
</body>
</html>
