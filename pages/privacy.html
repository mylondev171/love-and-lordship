  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../components/nav.jsx"></script>
  <script type="text/babel" src="../components/footer-events-app.jsx"></script>
  <script type="text/babel" src="../components/page-shell.jsx"></script>

  <script type="text/babel">
    function PrivacyPage() {
      return (
        <PageShell header={
          <PageHeader
            eyebrow="Last updated · May 2026"
            title="Privacy <em>Policy</em>."
            sub="How Love & Lordship collects, uses, and protects information about the people who visit, give, register, or otherwise engage with this ministry."
            deco="P"
          />
        }>
          <section className="page-section">
            <div className="wrap">
              <div className="legal">
                <h2>What we collect</h2>
                <p>When you sign up for our newsletter, register for an event, give a gift, or contact us, you may share information such as your name, email address, phone number, mailing address, and payment details. This website does not use advertising cookies or tracking pixels.</p>

                <h2>How we use it</h2>
                <p>We use your information only to:</p>
                <ul>
                  <li>Deliver newsletters and resources you've requested</li>
                  <li>Process and acknowledge gifts and tax-deductible receipts</li>
                  <li>Register you for events and follow up afterward</li>
                  <li>Respond to questions, prayer requests, or partnership inquiries</li>
                  <li>Improve this website and the L&amp;L app</li>
                </ul>

                <h2>What we never do</h2>
                <p>We do not sell, rent, or trade your information. Period. We do not share your data with third parties for advertising. We do not store payment card numbers — all giving is processed by our payment partner under PCI-compliant standards.</p>

                <h2>Cookies and analytics</h2>
                <p>This site does not set advertising or tracking cookies, and we do not build advertising profiles. Pages load fonts from Google Fonts. When you use a service we link to — Cornerstone for giving, a Google Form for the newsletter, YouTube and Podbean for video and audio, or the connectapp. app — that service's own privacy policy applies to what you share there.</p>

                <h2>Your rights</h2>
                <p>You can ask to be removed from our email list at any time. You can request a copy of the information we hold about you, ask us to correct it, or ask us to delete it. Email <strong>loveandlordship@gmail.com</strong> and we'll respond within ten business days.</p>

                <h2>Children</h2>
                <p>This site is intended for adults. We do not knowingly collect information from children under thirteen. If you believe a child has provided us information, contact us and we'll delete it immediately.</p>

                <h2>Changes to this policy</h2>
                <p>If we update this policy meaningfully, we'll note the change at the top of this page and, where appropriate, email subscribers.</p>

                <h2>Questions</h2>
                <p>Email loveandlordship@gmail.com or write to Love &amp; Lordship, 324 Timothy Drive, Nicholasville, KY 40356.</p>
              </div>
            </div>
          </section>
        </PageShell>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<PrivacyPage />);
  </script>
</body>
