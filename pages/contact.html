<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Love &amp; Lordship</title>
  <meta name="description" content="Reach the Love & Lordship team — office address, phone, prayer requests, partner support, press inquiries." />
  <link rel="canonical" href="https://loveandlordship.com/pages/contact.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Contact" />
  <meta property="og:description" content="Reach the Love &amp; Lordship team — office address, phone, prayer requests, partner support, press inquiries." />
  <meta property="og:url" content="https://loveandlordship.com/pages/contact.html" />
  <meta property="og:image" content="https://loveandlordship.com/assets/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Love &amp; Lordship" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#234090" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../components/nav.css" />
  <link rel="stylesheet" href="../components/hero.css" />
  <link rel="stylesheet" href="../components/pillars.css" />
  <link rel="stylesheet" href="../components/book-media.css" />
  <link rel="stylesheet" href="../components/sections.css" />
  <link rel="stylesheet" href="../components/pages.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../components/nav.jsx"></script>
  <script type="text/babel" src="../components/footer-events-app.jsx"></script>
  <script type="text/babel" src="../components/page-shell.jsx"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js" integrity="sha384-SALc35EccAf6RzGw4iNsyj7kTPr33K7RoGzYu+7heZhT8s0GZouafRiCg1qy44AS" crossorigin="anonymous"></script>
  <script src="../components/emailjs-config.js"></script>

  <script type="text/babel">
    const REASONS = [
      "General inquiry",
      "Prayer request",
      "Partner / giving question",
      "Event registration help",
      "Invite Greg to speak",
      "Press / media",
      "Volunteer interest",
    ];

    const FAQ = [
      { q: "How long does it take to hear back?", a: "Every message is read by a real person, and we reply as soon as we can. If it's time-sensitive, please call (859) 229-6504." },
      { q: "How do I give?", a: "Gifts are made securely through Cornerstone at give.cornerstone.cc/loveandlordship — once, or weekly, monthly, quarterly or yearly. You can also mail a check to Love & Lordship, 324 Timothy Drive, Nicholasville, KY 40356. Questions about a gift? Call (859) 229-6504." },
      { q: "Can Greg speak at our church?", a: "Yes — Greg keeps a limited speaking calendar each year. The fastest path is the Invite Greg page, which captures the details we need to give you an honest answer quickly." },
      { q: "Can our church or ministry use The Authority of Love as curriculum?", a: "Yes — it's already used as discipleship curriculum by partner ministries like Sisters for Life and Marriage for Life. Send us a note about your group and we'll talk through bulk copies, the companion workbook, and how to get started." },
    ];

    function ContactPage() {
      const { status, onSubmit, reset } = useFormSender("Contact message", (f) => `Website message: ${f.querySelector("select").value}`);

      return (
        <PageShell header={
          <PageHeader
            eyebrow="Contact"
            title="We'd love to <em>hear from you</em>."
            sub="Prayer, partnership, events, press — whatever the reason, send a note and a real person will read it."
            deco="C"
          />
        }>
          <section className="page-section">
            <div className="wrap">
              <div className="split-cols right">
                <div>
                  <div className="form-card">
                    {status === "sent" || status === "mailto" ? (
                      <FormResult status={status} title="Thank you." onBack={reset} />
                    ) : (
                      <form onSubmit={onSubmit}>
                        <Honeypot />
                        <div className="eyebrow" style={{ marginBottom: 14 }}>Send a message</div>
                        <div className="form-row">
                          <div className="field"><label>First name</label><input type="text" required /></div>
                          <div className="field"><label>Last name</label><input type="text" required /></div>
                        </div>
                        <div className="form-row">
                          <div className="field"><label>Email</label><input type="email" required /></div>
                          <div className="field"><label>Phone (optional)</label><input type="tel" /></div>
                        </div>
                        <div className="form-row full">
                          <div className="field"><label>Reason</label>
                            <select>
                              {REASONS.map(r => <option key={r}>{r}</option>)}
                            </select>
                          </div>
                        </div>
                        <div className="form-row full">
                          <div className="field"><label>Message</label><textarea required placeholder="Tell us what you'd like to share."></textarea></div>
                        </div>
                        <button className="btn btn-give" style={{ width: "100%", justifyContent: "center", marginTop: 8 }} type="submit" disabled={status === "sending"}>{status === "sending" ? "Sending…" : "Send message"}</button>
                        {status === "error" && <FormError />}
                      </form>
                    )}
                  </div>
                </div>
                <div>
                  <div className="eyebrow">Direct</div>
                  <h2>Find <em>us</em>.</h2>
                  <div className="contact-info" style={{ marginTop: 24 }}>
                    <div className="contact-row">
                      <div className="ic">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M8 14s-5-3.5-5-7.5A5 5 0 0 1 13 6.5C13 10.5 8 14 8 14z"/><circle cx="8" cy="6.5" r="1.5"/></svg>
                      </div>
                      <div>
                        <div className="lbl">Mailing address</div>
                        <div className="val">Love &amp; Lordship<br/>324 Timothy Drive<br/>Nicholasville, KY 40356</div>
                      </div>
                    </div>
                    <div className="contact-row">
                      <div className="ic">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M4 3h3l1 3-2 1c.6 1.6 1.8 2.8 3.4 3.4l1-2 3 1v3a1 1 0 0 1-1 1A10 10 0 0 1 3 4a1 1 0 0 1 1-1z"/></svg>
                      </div>
                      <div>
                        <div className="lbl">Phone</div>
                        <div className="val"><a href="tel:+18592296504">(859) 229-6504</a></div>
                      </div>
                    </div>
                    <div className="contact-row">
                      <div className="ic">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 5l6 4 6-4"/></svg>
                      </div>
                      <div>
                        <div className="lbl">Email</div>
                        <div className="val"><a href="mailto:loveandlordship@gmail.com">loveandlordship@gmail.com</a></div>
                      </div>
                    </div>
                    <div className="contact-row">
                      <div className="ic">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M8 2v6l4 2"/><circle cx="8" cy="8" r="6"/></svg>
                      </div>
                      <div>
                        <div className="lbl">Office hours</div>
                        <div className="val">Mon–Fri · 9 AM – 5 PM ET</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section className="page-section" style={{ background: "var(--paper)" }}>
            <div className="wrap">
              <div className="eyebrow">FAQ</div>
              <h2>Common <em>questions</em>.</h2>
              <div className="faq" style={{ marginTop: 28 }}>
                {FAQ.map((f, i) => (
                  <details key={i}>
                    <summary>{f.q}</summary>
                    <p>{f.a}</p>
                  </details>
                ))}
              </div>
            </div>
          </section>
        </PageShell>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<ContactPage />);
  </script>
</body>
</html>
