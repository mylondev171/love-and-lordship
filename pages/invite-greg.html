<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invite Greg to Speak — Love &amp; Lordship</title>
  <meta name="description" content="Invite Greg Williams to speak at your church, conference, or partner event. Marriage, family, discipleship, and the Authority of Love." />
  <link rel="canonical" href="https://loveandlordship.com/pages/invite-greg.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Invite Greg to Speak" />
  <meta property="og:description" content="Invite Greg Williams to speak at your church, conference, or partner event. Marriage, family, discipleship, and the Authority of Love." />
  <meta property="og:url" content="https://loveandlordship.com/pages/invite-greg.html" />
  <meta property="og:image" content="https://loveandlordship.com/assets/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Love &amp; Lordship" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#234090" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../components/nav.css" />
  <link rel="stylesheet" href="../components/hero.css" />
  <link rel="stylesheet" href="../components/pillars.css" />
  <link rel="stylesheet" href="../components/book-media.css" />
  <link rel="stylesheet" href="../components/sections.css" />
  <link rel="stylesheet" href="../components/pages.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../components/nav.jsx"></script>
  <script type="text/babel" src="../components/footer-events-app.jsx"></script>
  <script type="text/babel" src="../components/page-shell.jsx"></script>

  <script type="text/babel">
    const TOPICS = [
      { i: "L", h: "The Authority of Love", p: "Greg's keynote — the foundation under every life and relationship." },
      { i: "D", h: "Disciples Who Make Disciples", p: "Multiplying ministry beyond programs and platforms." },
      { i: "R", h: "Loving Relationships", p: "How God's love in Christ reorders every human relationship — family, friendship, neighbor, enemy." },
      { i: "F", h: "Forgiveness That Heals", p: "From the wreckage of broken trust to genuine restoration." },
      { i: "M", h: "Marriage as Covenant", p: "Practical, scriptural teaching for couples in every season." },
      { i: "P", h: "Disciple-Making Parents", p: "Raising children who love Christ in a distracted culture." },
      { i: "C", h: "Character &amp; Purity", p: "For students, young adults, and the leaders who shepherd them." },
      { i: "H", h: "Loving &amp; Leading in Christ's Church", p: "Servant-leadership for pastors, elders, and lay leaders who shepherd the bride." },
      { i: "K", h: "Changing Culture", p: "Salt and light — engaging the public square as Kingdom ambassadors." },
    ];

    function InvitePage() {
      const [sent, setSent] = React.useState(false);
      return (
        <PageShell header={
          <PageHeader
            eyebrow="Invite Greg to speak"
            title="Bring the <em>message</em> to your community."
            sub="Greg speaks at churches, conferences, marriage events, and partner ministries across the United States and abroad. Tell us about your event and we'll be in touch."
            deco="I"
          />
        }>
          <section className="page-section">
            <div className="wrap">
              <div className="split-cols right">
                <div>
                  <div className="form-card">
                    {sent ? (
                      <EmailSent title="Almost there." onBack={() => setSent(false)} />
                    ) : (
                      <form onSubmit={(e) => { e.preventDefault(); emailForm(e.currentTarget, 'Speaking request for Greg Williams'); setSent(true); }}>
                        <div className="eyebrow" style={{ marginBottom: 14 }}>Speaking request</div>
                        <div className="form-row">
                          <div className="field"><label>Your name</label><input type="text" required /></div>
                          <div className="field"><label>Role</label><input type="text" placeholder="Pastor, planner, ministry leader…" /></div>
                        </div>
                        <div className="form-row">
                          <div className="field"><label>Email</label><input type="email" required /></div>
                          <div className="field"><label>Phone</label><input type="tel" /></div>
                        </div>
                        <div className="form-row">
                          <div className="field"><label>Church or organization</label><input type="text" required /></div>
                          <div className="field"><label>City / state</label><input type="text" required /></div>
                        </div>
                        <div className="form-row">
                          <div className="field"><label>Event date(s)</label><input type="text" placeholder="e.g. Mar 13–14, 2027" /></div>
                          <div className="field"><label>Expected attendance</label>
                            <select>
                              <option>Under 100</option>
                              <option>100–300</option>
                              <option>300–800</option>
                              <option>800+</option>
                            </select>
                          </div>
                        </div>
                        <div className="form-row">
                          <div className="field"><label>Event type</label>
                            <select>
                              <option>Sunday morning</option>
                              <option>Weekend marriage conference</option>
                              <option>Mid-week intensive</option>
                              <option>Retreat (multi-day)</option>
                              <option>Keynote / one session</option>
                              <option>Partner ministry training</option>
                            </select>
                          </div>
                          <div className="field"><label>Topic of interest</label>
                            <select>
                              {TOPICS.map(t => <option key={t.h}>{t.h.replace(/&amp;/g, "&")}</option>)}
                              <option>Open / not sure yet</option>
                            </select>
                          </div>
                        </div>
                        <div className="form-row full">
                          <div className="field"><label>Tell us about your event</label><textarea placeholder="Audience, hopes, context, what's prompting the invitation…" rows="5"></textarea></div>
                        </div>
                        <button className="btn btn-give" type="submit" style={{ width: "100%", justifyContent: "center", marginTop: 8 }}>Send speaking request</button>
                        <p style={{ marginTop: 14, fontSize: 12.5, color: "var(--ink-mute)", textAlign: "center", margin: "14px 0 0" }}>Greg's calendar fills 9–12 months out. The sooner, the better.</p>
                      </form>
                    )}
                  </div>
                </div>
                <div>
                  <div className="eyebrow">Topics</div>
                  <h2>What Greg <em>speaks on</em>.</h2>
                  <p>Any of these can be adapted to a single session, a weekend, or a multi-day intensive or a multi-week series (depending on location). Greg also speaks on related custom topics by request.</p>
                  <div className="topic-grid">
                    {TOPICS.map(t => (
                      <div className="topic" key={t.h}>
                        <div className="icn">
                          <span style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontSize: 20, lineHeight: 1 }}>{t.i}</span>
                        </div>
                        <h4 dangerouslySetInnerHTML={{ __html: t.h }} />
                        <p>{t.p}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section className="page-section" style={{ background: "var(--paper)" }}>
            <div className="wrap">
              <div className="eyebrow">Where Greg has spoken</div>
              <h2>From small churches to <em>international</em> stages.</h2>
              <p>Lexington · Louisville · Cincinnati / Northern KY · Bloomington · Dallas · Atlanta · Nashville · Chicago · Denver · Phoenix · Los Angeles · San Antonio · Orlando · Douala, Cameroon · Kingston, Jamaica · Ireland · Moscow, Russia · St. Petersburg, Russia · Kyiv, Ukraine · Zenica, Bosnia / Herzegovina · Sarajevo, Yugoslavia</p>
              <p style={{ marginTop: 18 }}>Greg has spoken at the International Marriage &amp; Family Conference (Cameroon), Sisters for Life leadership trainings, numerous churches and dozens of partner conferences across the US, and at local churches in Kentucky and other states.</p>
            </div>
          </section>

          <section className="page-section">
            <div className="wrap">
              <div className="split-cols">
                <div>
                  <div className="eyebrow">What to expect</div>
                  <h2>Worship, Scripture, and time to <em>talk</em>.</h2>
                </div>
                <div>
                  <p>Worship and a clear word from Scripture; practical, time-tested teaching on marriage, family, and discipleship; and time to interact with your spouse or small group between sessions. Flexible and adaptive schedules include:</p>
                  <ul style={{ paddingLeft: 18, color: "var(--ink-soft)", fontSize: 16, lineHeight: 1.7 }}>
                    <li>Saturday marriage or men's conferences run 9 AM – 4 PM with two breaks.</li>
                    <li>Retreats are Friday evening through Saturday evening or Sunday morning.</li>
                    <li>Webinars and replays are available afterward to all registered attendees (capacity permitting — please ask).</li>
                    <li>Scholarships available — contact us before registering.</li>
                  </ul>
                </div>
              </div>
            </div>
          </section>
        </PageShell>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<InvitePage />);
  </script>
</body>
</html>
